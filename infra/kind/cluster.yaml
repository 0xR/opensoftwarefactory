kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # NodePort services mapped to localhost so no port-forward is needed and
    # pod restarts do not break the URLs: the factory UI, the Temporal UI, and
    # OpenObserve. Each Service carries its localhost URL in the annotation
    # opensoftwarefactory.dev/url, which the Cluster tab shows as a link.
    extraPortMappings:
      - containerPort: 30082
        hostPort: 8082
        listenAddress: 127.0.0.1
      - containerPort: 30233
        hostPort: 8233
        listenAddress: 127.0.0.1
      - containerPort: 30080
        hostPort: 5080
        listenAddress: 127.0.0.1
