apiVersion: v1
kind: Service
metadata:
  name: factory-ui
  labels:
    app.kubernetes.io/name: factory-ui
  annotations:
    opensoftwarefactory.dev/url: http://localhost:8082
spec:
  # NodePort 30082 is mapped to localhost:8082 in infra/kind/cluster.yaml.
  type: NodePort
  selector:
    app.kubernetes.io/name: factory-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30082
