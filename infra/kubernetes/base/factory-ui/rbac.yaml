apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-ui
  labels:
    app.kubernetes.io/name: factory-ui
---
# Read-only view of the factory's own workloads for the Cluster tab.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-ui-viewer
  labels:
    app.kubernetes.io/name: factory-ui
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-ui-viewer
  labels:
    app.kubernetes.io/name: factory-ui
subjects:
  - kind: ServiceAccount
    name: factory-ui
roleRef:
  kind: Role
  name: factory-ui-viewer
  apiGroup: rbac.authorization.k8s.io
---
# Nodes are cluster-scoped, so their read access needs a ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factory-ui-node-viewer
  labels:
    app.kubernetes.io/name: factory-ui
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: factory-ui-node-viewer
  labels:
    app.kubernetes.io/name: factory-ui
subjects:
  - kind: ServiceAccount
    name: factory-ui
    namespace: opensoftwarefactory
roleRef:
  kind: ClusterRole
  name: factory-ui-node-viewer
  apiGroup: rbac.authorization.k8s.io
