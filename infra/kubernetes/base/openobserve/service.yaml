apiVersion: v1
kind: Service
metadata:
  name: openobserve
  labels:
    app.kubernetes.io/name: openobserve
  annotations:
    opensoftwarefactory.dev/url: http://localhost:5080
spec:
  # NodePort 30080 is mapped to localhost:5080 in infra/kind/cluster.yaml.
  type: NodePort
  selector:
    app.kubernetes.io/name: openobserve
  ports:
    - name: http
      port: 5080
      targetPort: http
      nodePort: 30080
