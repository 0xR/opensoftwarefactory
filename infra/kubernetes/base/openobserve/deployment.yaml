apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve
  labels:
    app.kubernetes.io/name: openobserve
spec:
  replicas: 1
  # SQLite/local storage must have only one writer during updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openobserve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openobserve
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 3000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openobserve
          image: public.ecr.aws/zinclabs/openobserve:v1.1.2@sha256:4a154849432f75c4fb024de32fe34163c02406c905dab22bf8d213d2e3386392
          imagePullPolicy: IfNotPresent
          command: ["/openobserve"]
          args: ["--config", "/config/openobserve.env"]
          ports:
            - name: http
              containerPort: 5080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          hostPath:
            path: /openobserve/config
            type: Directory
        - name: data
          hostPath:
            path: /openobserve/data
            type: Directory
