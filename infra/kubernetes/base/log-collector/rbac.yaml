apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-collector
  labels:
    app.kubernetes.io/name: log-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-collector
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: log-collector
subjects:
  - kind: ServiceAccount
    name: log-collector
