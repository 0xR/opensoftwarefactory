apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-collector
  labels:
    app.kubernetes.io/name: telemetry-collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetry-collector
          image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
          args: ["--config=/config/otel-collector.yaml"]
          ports:
            - { name: otlp, containerPort: 4318 }
            - { name: health, containerPort: 13133 }
            - { name: metrics, containerPort: 8888 }
          readinessProbe:
            httpGet: { path: /, port: health }
          livenessProbe:
            httpGet: { path: /, port: health }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: buffer, mountPath: /buffers }
      volumes:
        - name: config
          hostPath: { path: /openobserve/config, type: Directory }
        - name: buffer
          hostPath: { path: /var/lib/opensoftwarefactory/trace-collector, type: DirectoryOrCreate }
