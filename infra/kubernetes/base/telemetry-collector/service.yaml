apiVersion: v1
kind: Service
metadata:
  name: telemetry-collector
spec:
  selector:
    app.kubernetes.io/name: telemetry-collector
  ports:
    - { name: otlp, port: 4318, targetPort: otlp }
    - { name: health, port: 13133, targetPort: health }
    - { name: metrics, port: 8888, targetPort: metrics }
