apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The factory's services, all in the namespace opensoftwarefactory.
  - factory
  # The namespace of the dev pods and the connector service's rights in it. It is kept apart
  # so that the factory's namespace is not written over these objects.
  - ../../base/connectors/devpods
